name: gendiff
channels:
  - pytorch
  - nvidia
dependencies:
  - python>=3.8, < 3.10  # package build failures on 3.10
  - pip
  - numpy>=1.20, < 2
  - click>=8.0
  - pillow>=8.3.1
  - scipy>=1.7.1
  - pytorch=2.0.0
  - torchvision
  - psutil
  - requests
  - tqdm
  - pip:
    - wandb
    - accelerate